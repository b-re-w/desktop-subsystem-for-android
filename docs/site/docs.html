<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="How to install and use Desktop Subsystem for Android, and what to do when something goes wrong.">
<title>DSA guides</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#e6e5e2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@112..125,500..700&family=Tektur:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* The guides, in the guidebook's paper look: the same header, the hero's hairline frame and
   mono labels, the orange square, and the trademark notice as the main page sets it. The
   guides themselves are the Markdown files in docs/guides, fetched and drawn here. */
:root{--pg:#e6e5e2;--cell:#efeeeb;--fg:#1b1a19;--fg2:#3b3936;--mut:#5d5a56;--line:#b3b0ab;--ln:color-mix(in srgb,currentColor 26%,transparent);--soft:color-mix(in srgb,currentColor 64%,transparent);
  --accent:#f0661c;--accent-ink:#1b1a19;--accent-text:#b9501c;--hdr:56px;--hb:230,229,226;
  --f-head:"Saira","IBM Plex Sans KR","Segoe UI",system-ui,sans-serif;--f-mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,Consolas,monospace;
  --f-text:"IBM Plex Sans KR","IBM Plex Sans","Segoe UI",system-ui,sans-serif;color-scheme:light}
html:lang(ja){--f-loc:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP",sans-serif}
html:lang(zh-CN){--f-loc:"Noto Sans SC","PingFang SC","Microsoft YaHei UI",sans-serif}
html:lang(zh-TW){--f-loc:"Noto Sans TC","PingFang TC","Microsoft JhengHei UI",sans-serif}
html:lang(ru){--f-loc:"IBM Plex Sans","Segoe UI",system-ui,sans-serif}
html.loc{--f-text:var(--f-loc);--f-mono:"IBM Plex Mono",var(--f-loc)}
*{box-sizing:border-box}
html{background:var(--pg)}
body{margin:0;background:var(--pg);color:#252423;font:400 15px/1.5 var(--f-head);font-stretch:118%;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header: the main page's, in its paper state */
#site-header{position:fixed;inset:0 0 auto;z-index:20;height:calc(var(--hdr) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#4a4745;background:rgb(var(--hb));border-bottom:1px solid var(--line)}
#site-menu ul{display:flex;gap:4px;align-items:center;list-style:none}
#site-menu a{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:4px;transition:background-color .2s,color .2s}
#site-menu a:hover{background:rgba(127,127,127,.14);color:var(--fg)}
#site-menu a[aria-current="page"]{color:var(--fg)}
#site-menu svg{width:13px;height:13px}
.hdr-right{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.logo{display:inline-flex;align-items:center;gap:10px;min-width:0;justify-self:start;color:var(--fg);text-transform:none;letter-spacing:0}
.logo svg{width:36px;height:36px;flex:none;display:block}
.logo span{display:grid;gap:3px;font:800 17px/1 "Saira",var(--f-head);font-stretch:112%;letter-spacing:.01em;white-space:nowrap}
.logo small{font:500 10.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.logo:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* the main page's primary button: the orange cell with two cut corners */
.v3-btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;font:500 13px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.v3-btn.primary{background:var(--accent);color:var(--fg)}
.v3-btn.primary:hover{filter:brightness(1.06)}
.v3-btn:focus-visible{outline-offset:-5px}
.hdr-dl{box-sizing:border-box;height:30px;padding:0 13px 0 12px;font-size:11.5px;line-height:1;gap:8px;white-space:nowrap;border:0;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}   /* the same height as the language button beside it, so the corner cut is scaled down too */
.hdr-dl svg{width:12px;height:12px;flex:none}
#site-header .lang-pop{left:auto;right:0}
html.cjk #site-menu span,html.cjk .hdr-dl span{font-size:13px;letter-spacing:.02em}

/* the language menu, as on the main page */
.lang-menu{position:relative;display:inline-flex}
.lang-btn{all:unset;box-sizing:border-box;position:relative;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 9px 0 11px;border:1px solid var(--ln);
  font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:inherit;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.lang-btn::before{content:"";position:absolute;left:-1px;top:-1px;width:5px;height:5px;background:var(--accent)}
.lang-btn svg{width:10px;height:10px;flex:none;transition:transform .2s}
.lang-btn:hover,.lang-menu.open .lang-btn{border-color:currentColor}
.lang-menu.open .lang-btn svg{transform:rotate(180deg)}
.lang-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lang-pop{position:absolute;left:0;top:calc(100% + 8px);z-index:30;width:248px;max-width:calc(100vw - 32px);background:rgb(var(--hb));border:1px solid var(--ln);box-shadow:0 14px 34px -12px rgba(0,0,0,.35)}
.lang-pop::before,.lang-pop::after{content:"";position:absolute;width:6px;height:6px;background:var(--accent);z-index:1}
.lang-pop::before{left:-1px;top:-1px}.lang-pop::after{right:-1px;bottom:-1px}
.lang-list{list-style:none;max-height:calc(100svh - var(--hdr) - env(safe-area-inset-top,0px) - 28px);overflow-y:auto;overscroll-behavior:contain;padding:5px 0;outline:none;text-transform:none;letter-spacing:0;scrollbar-width:thin}
.lang-list li{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 14px;cursor:pointer}
.lang-list li+li{border-top:1px solid color-mix(in srgb,currentColor 12%,transparent)}
.lang-list li i{width:6px;height:6px;flex:none;border:1px solid var(--ln)}
#site-header .lang-list .nm{flex:1;min-width:0;font:500 14px/1.25 "IBM Plex Sans KR","IBM Plex Sans",system-ui,sans-serif;letter-spacing:0}
.lang-list .cd{font:500 11px/1 var(--f-mono);letter-spacing:.1em;color:var(--soft)}
.lang-list li.active{background:color-mix(in srgb,currentColor 9%,transparent)}
.lang-list:focus-visible li.active{box-shadow:inset 2px 0 0 var(--accent)}
.lang-list li[aria-selected="true"] i{background:var(--accent);border-color:var(--accent)}
.lang-list li[aria-selected="true"] .cd{color:var(--accent-text)}

/* the frame: the hero's hairline columns, a rail of guides, the guide, its contents */
.frame{max-width:1440px;margin:0 auto;padding-top:calc(var(--hdr) + env(safe-area-inset-top,0px));min-height:100svh;
  border-left:1px solid var(--line);border-right:1px solid var(--line);display:grid;grid-template-columns:268px minmax(0,1fr) 232px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail,.toc{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100svh - var(--hdr) - 96px);overflow-y:auto;scrollbar-width:thin}
.rail{border-right:1px solid var(--line)}
.toc{border-left:1px solid var(--line)}
.label{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);font:500 12px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.label i{width:10px;height:10px;flex:none;background:var(--accent)}
html.cjk .label{letter-spacing:.04em}
.rail ol{list-style:none;padding:8px 0}
.rail a{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px;padding:8px 20px;font:500 14px/1.35 var(--f-text);color:var(--fg2)}
.rail a b{font:500 11px/1.9 var(--f-mono);color:var(--mut);letter-spacing:.06em}
.rail a:hover{color:var(--fg);background:color-mix(in srgb,currentColor 6%,transparent)}
.rail a[aria-current="page"]{color:var(--fg);box-shadow:inset 3px 0 0 var(--accent);background:var(--cell)}
.rail a[aria-current="page"] b{color:var(--accent-text)}
.toc ol{list-style:none;padding:10px 0}
.toc a{display:block;padding:5px 18px;font:400 13px/1.4 var(--f-text);color:var(--mut)}
.toc a.h3{padding-left:32px;font-size:12.5px}
.toc a:hover{color:var(--fg)}
.toc a.on{color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}

/* the notice stays fixed where the main page has it; the guide ends far enough above it that its
   last lines scroll clear of the notice */
main{min-width:0;padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px clamp(20px,4vw,56px);border-bottom:1px solid var(--line);font:500 12px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.crumb a:hover{color:var(--fg)}
.crumb .sep{opacity:.6}
html.cjk .crumb{letter-spacing:.04em}
.notice{margin:24px clamp(20px,4vw,56px) 0;padding:12px 16px;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--cell);font:400 14px/1.55 var(--f-text);color:var(--fg2)}
article{padding:36px clamp(20px,4vw,56px) 40px;max-width:820px;font:400 16px/1.7 var(--f-text);color:var(--fg2)}
html.cjk article{line-height:1.8}
html:lang(ja) article,html:lang(zh-CN) article,html:lang(zh-TW) article{word-break:normal;line-break:strict}
html:lang(ko) article{word-break:keep-all}
article h1{font:700 clamp(32px,4vw,48px)/1.05 "Tektur",var(--f-head);letter-spacing:-.01em;color:var(--fg);margin:0 0 20px;text-wrap:balance}
html.loc article h1,html:lang(ko) article h1{font-family:var(--f-text);font-weight:700;letter-spacing:-.02em;line-height:1.2}
article h2{font:600 clamp(22px,2.2vw,28px)/1.2 var(--f-head);color:var(--fg);margin:48px 0 14px;padding-top:18px;border-top:1px solid var(--line);position:relative}
article h3{font:600 18px/1.3 var(--f-head);color:var(--fg);margin:32px 0 10px;position:relative}
html.loc article h2,html.loc article h3,html:lang(ko) article h2,html:lang(ko) article h3{font-family:var(--f-text);letter-spacing:-.01em}
article h4{font:600 16px/1.4 var(--f-text);color:var(--fg);margin:24px 0 8px}
article :is(h2,h3,h4){scroll-margin-top:calc(var(--hdr) + 20px)}
.anchor{margin-left:.35em;font:500 .7em/1 var(--f-mono);color:var(--accent-text);opacity:0;transition:opacity .15s;text-decoration:none}
article :is(h2,h3,h4):hover .anchor,.anchor:focus-visible{opacity:1}
article p,article ul,article ol,article table,article pre,article blockquote,.tablewrap{margin:0 0 16px}
article ul,article ol{padding-left:1.4em}
article li{margin:4px 0}
article li::marker{color:var(--mut)}
article a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px}
article a:hover{color:var(--accent-text)}
article strong{color:var(--fg);font-weight:600}
article code{font:400 .88em/1.4 var(--f-mono);background:var(--cell);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);padding:.08em .35em;border-radius:3px;color:var(--fg);overflow-wrap:anywhere}
.code{position:relative;margin:0 0 18px}
.code pre{margin:0;padding:16px 18px;background:#1b1a19;color:#ecebe8;overflow-x:auto;font:400 13.5px/1.6 var(--f-mono);
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.code pre code{background:none;border:0;padding:0;color:inherit;font:inherit;overflow-wrap:normal}
.copy{all:unset;box-sizing:border-box;position:absolute;right:8px;top:8px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;cursor:pointer;
  font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#bdbab5;border:1px solid #4a4745;background:#252423}
.copy:hover,.copy:focus-visible{color:#fff;border-color:var(--accent)}
.copy.done{color:var(--accent)}
.copy svg{width:12px;height:12px}
.tablewrap{overflow-x:auto;border:1px solid var(--line)}
article table{border-collapse:collapse;width:100%;margin:0;font-size:14.5px;line-height:1.55}
article th{text-align:left;font:500 11.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);background:var(--cell)}
html.cjk article th{letter-spacing:.02em;font-size:12.5px}
article th,article td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
article td+td,article th+th{border-left:1px solid var(--line)}
article th code{font:inherit;letter-spacing:inherit;background:none;border:0;padding:0;color:inherit;white-space:nowrap;overflow-wrap:normal}
article td code{white-space:nowrap}
article tr:last-child td{border-bottom:0}
article blockquote{margin-left:0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--cell);color:var(--fg2)}
article blockquote p:last-child{margin:0}
article img{max-width:100%;height:auto}
article hr{border:0;border-top:1px solid var(--line);margin:32px 0}
.pager{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin:0 clamp(20px,4vw,56px);max-width:708px}
.pager a{display:grid;gap:6px;padding:18px 0;font:500 16px/1.3 var(--f-text);color:var(--fg)}
.pager a span{font:500 11.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.pager a.next{text-align:right;border-left:1px solid var(--line);padding-left:18px}
.pager a.prev{padding-right:18px}
.pager a:hover{color:var(--accent-text)}
.state{padding:48px clamp(20px,4vw,56px);font:400 15px/1.6 var(--f-text);color:var(--mut)}
.state a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--accent)}

/* the index: one hairline cell per guide */
.cards{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin:28px 0 0;padding:0}
.cards li{margin:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.frame.notoc main{grid-column:2/-1}
.cards a{display:grid;gap:8px;align-content:start;height:100%;padding:18px 20px 20px;text-decoration:none;color:var(--fg2)}
.cards a b{font:500 11.5px/1 var(--f-mono);letter-spacing:.12em;color:var(--mut)}
.cards a strong{font:600 18px/1.25 var(--f-text);color:var(--fg)}
.cards a span{font-size:14.5px;line-height:1.55}
.cards a:hover{background:var(--cell)}
.cards a:hover b{color:var(--accent-text)}

/* "On Windows": a small working desktop with Android's Clock, Settings and Files as windows.
   It is laid out at 800 x 560 and scaled to the column, so it keeps its proportions on a phone. */
.ex{margin:6px 0 30px;border:1px solid var(--line);background:var(--cell)}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.ex-head .label{border-bottom:0}
.ex-reset{all:unset;box-sizing:border-box;margin-right:12px;height:28px;padding:0 10px;border:1px solid var(--ln);cursor:pointer;font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.ex-reset:hover{color:var(--fg);border-color:currentColor}
.ex-reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.desk-wrap{position:relative;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:800px;height:560px;transform-origin:0 0;background:#efeeeb;
  background-image:linear-gradient(to right,rgba(27,26,25,.07) 1px,transparent 1px),linear-gradient(rgba(27,26,25,.07) 1px,transparent 1px);background-size:33px 33px;
  font:400 13px/1.35 "IBM Plex Sans KR","IBM Plex Sans",system-ui,sans-serif;letter-spacing:0;color:#1f1f1f;user-select:none;-webkit-user-select:none}
.area{position:absolute;left:0;top:0;right:0;height:506px}
.win{position:absolute;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.05),0 14px 36px -10px rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.12);
  transition:opacity .18s,transform .18s}
.win.min,.win.shut{opacity:0;transform:translateY(24px) scale(.96);pointer-events:none;visibility:hidden;transition:opacity .18s,transform .18s,visibility 0s .18s}
.win.front{box-shadow:0 1px 0 rgba(0,0,0,.05),0 20px 44px -10px rgba(0,0,0,.45)}
.win:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.capt{display:flex;align-items:center;gap:8px;height:34px;flex:none;padding-left:10px;cursor:grab;touch-action:none;font-size:12.5px}
.win.dragging .capt{cursor:grabbing}
.capt .ai{width:16px;height:16px;flex:none;display:grid;place-items:center;border-radius:4px}
.capt .ai svg{width:12px;height:12px}
.capt .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.capt button{all:unset;box-sizing:border-box;width:44px;height:34px;display:grid;place-items:center;cursor:pointer;color:inherit}
.capt button svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.1}
.capt button:hover{background:rgba(127,127,127,.18)}
.capt button.x:hover{background:#c42b1c;color:#fff}
.capt button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.abody{flex:1;min-height:0;overflow:hidden;position:relative}
.abody svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* clock: the dark navy app */
.win.clock{background:#1f2370;color:#fff}
.clock .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid rgba(255,255,255,.16);font-size:11px;color:#c9cbf2}
.clock .tabs span{display:grid;justify-items:center;gap:4px;padding:8px 2px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.clock .tabs svg{width:15px;height:15px}
.clock .tabs span.on{color:#fff;box-shadow:inset 0 -3px 0 #fff}
.alarm{display:grid;grid-template-columns:1fr auto;align-items:center;padding:12px 14px 14px;border-bottom:1px solid rgba(255,255,255,.14)}
.alarm b{display:flex;align-items:baseline;gap:6px;font:300 38px/1 "IBM Plex Sans","IBM Plex Sans KR",system-ui,sans-serif;color:#b9bdf6;letter-spacing:-.01em}
.alarm b small{font:700 12px/1 "IBM Plex Sans KR",system-ui,sans-serif;color:#fff}
.alarm em{grid-column:1;font-style:normal;font-weight:700;font-size:11.5px;margin-top:4px}
.alarm.on b{color:#fff}
.sw{grid-row:1;grid-column:2;width:40px;height:22px;border-radius:11px;background:#5b5f9c;position:relative}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#c9cbf2}
.alarm.on .sw{background:#c4c8ff}.alarm.on .sw::after{left:21px;background:#1f2370}
.fab{position:absolute;left:50%;bottom:16px;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:#e8453c;display:grid;place-items:center;color:#fff}
.fab svg{width:20px;height:20px;stroke-width:2.2}
/* settings: the light lavender app */
.win.settings{background:#f3f1fb}
.settings .abody{padding:4px 10px 10px}
.search{display:flex;align-items:center;gap:10px;height:36px;padding:0 14px;border-radius:18px;background:#fff;border:1px solid #dcd9ea;color:#5d5a6e;margin-bottom:10px;font-size:12.5px}
.search svg{width:15px;height:15px}
.grp{background:#fff;border-radius:14px;margin-bottom:8px;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:9px 12px}
.it+.it{border-top:1px solid #efedf6}
.it .ic{width:26px;height:26px;flex:none;border-radius:7px;display:grid;place-items:center}
.it .ic svg{width:14px;height:14px}
.it div{min-width:0}
.it b{display:block;font-weight:600;font-size:13px}
.it div span{display:block;font-size:10.5px;color:#6b6876;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* files: the white app */
.win.files{background:#fff}
.files .abody{padding:2px 12px 10px}

.taskbar{position:absolute;left:0;right:0;bottom:0;height:54px;display:flex;justify-content:center;align-items:center;gap:12px;background:#e7e5e1;border-top:1px solid #cfccc7}
.tb{all:unset;box-sizing:border-box;position:relative;width:40px;height:40px;border-radius:6px;display:grid;place-items:center;cursor:pointer}
.tb svg{width:22px;height:22px}
.tb.dsa{cursor:default}
.tb::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:3px;margin-left:-6px;background:#f0661c;border-radius:1px;transition:width .15s,margin .15s}
.tb.off::after{display:none}
.tb.act::after{width:20px;margin-left:-10px}

.tb:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ex-cap{margin:0;padding:12px 18px 14px;border-top:1px solid var(--line);font:400 14px/1.55 var(--f-text);color:var(--fg2)}

      var toc=heads.map(function(h){return '<li><a class="'+(h.lvl==='H3'?'h3':'')+'" href="#'+encodeURIComponent(h.id)+'">'+esc(h.text)+'</a></li>'}).join('');
      $('toc-list').innerHTML=toc;$('toc').hidden=!heads.length;
      if(heads.length){var d=document.createElement('details');d.className='mtoc';d.innerHTML='<summary>'+esc(T('docs.onpage'))+'</summary><ol>'+toc+'</ol>';
        if(h1&&h1.nextSibling)art.insertBefore(d,h1.nextSibling);else art.prepend(d)}
      var i=rows.indexOf(cur),pv=rows[i-1],nx=rows[i+1],pg='';
      pg+=pv?'<a class="prev" href="'+docUrl(pv.name,l)+'" data-route><span>← '+esc(T('docs.prev'))+'</span>'+inline(pv.title)+'</a>':'<span></span>';
      pg+=nx?'<a class="next" href="'+docUrl(nx.name,l)+'" data-route><span>'+esc(T('docs.next'))+' →</span>'+inline(nx.title)+'</a>':'<span></span>';
      $('pager').innerHTML=pg;$('pager').hidden=false;
      /* a heading named in English: the same place among the translated headings */
      if(v[2]&&wantEn){var tmp=document.createElement('div');tmp.innerHTML=md2html(stripLangLine(v[2].text));var u={},k=-1;
        [].some.call(tmp.querySelectorAll('h1,h2,h3,h4'),function(h,j){if(slug(h.textContent,u)===wantEn){k=j;return true}});
        var mine=art.querySelectorAll('h1,h2,h3,h4');if(k>=0&&mine[k])hash=mine[k].id}
      else if(wantEn&&!hash)hash=wantEn;
      spy();
    }
    var target=hash&&document.getElementById(hash);
    if(target)target.scrollIntoView();else if(!keepScroll)scrollTo(0,0);
  }).catch(function(){if(my!==seq)return;
    art.innerHTML='<p class="state">'+esc(T('docs.error'))+' <a href="'+BLOB+'docs/guides/'+dir(l)+(g||'README')+'.md" target="_blank" rel="noopener">GitHub ↗</a></p>'})}

/* moving between guides stays on this page */
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[data-route]');if(!a||e.ctrlKey||e.metaKey||e.shiftKey||e.button)return;
  e.preventDefault();history.pushState(null,'',a.getAttribute('href'));toggleDrawer(false);readRoute();show(false)});
addEventListener('popstate',function(){readRoute();var q=/[?&]lang=([\w-]+)/.exec(location.search);if(q&&NAMES[q[1]]&&q[1]!==lang){setLang(q[1],false);route.lang=q[1]}show(true)});

/* the mobile guide list */
function toggleDrawer(on){var d=$('drawer'),b=$('drawer-btn');if(on===undefined)on=d.hidden;d.hidden=!on;b.setAttribute('aria-expanded',String(on));
  if(on){var c=d.querySelector('[aria-current]')||d.querySelector('a');if(c)c.focus({preventScroll:true})}}
$('drawer-btn').addEventListener('click',function(){toggleDrawer()});
$('drawer').addEventListener('keydown',function(e){if(e.key==='Escape'){toggleDrawer(false);$('drawer-btn').focus()}});

/* the contents list marks the section being read */
var spyLinks=[];
function spy(){spyLinks=[].slice.call(document.querySelectorAll('#toc-list a'));onSpy()}
function onSpy(){if(!spyLinks.length)return;var best=null;spyLinks.forEach(function(a){var h=document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
  if(h&&h.getBoundingClientRect().top<innerHeight*.3)best=a});spyLinks.forEach(function(a){a.classList.toggle('on',a===best)})}
addEventListener('scroll',onSpy,{passive:true});

/* a change of language keeps the reader on the same guide and, where it can, the same heading */
var startLang=pickLang();route.lang=startLang;readRoute();
setLang(startLang,false).then(function(){
  if(!/[?&]lang=/.test(location.search))history.replaceState(null,'',location.pathname+'?lang='+startLang+(route.g?'&g='+route.g:'')+location.hash);
  show(false)});
var keepHeading=function(){var hs=[].slice.call(document.querySelectorAll('#doc h2,#doc h3')),i=-1;hs.forEach(function(h,j){if(h.getBoundingClientRect().top<innerHeight*.3)i=j});return i};
var _choose=choose;choose=function(i){var at=keepHeading();_choose(i);
  history.replaceState(null,'','docs.html?lang='+route.lang+(route.g?'&g='+route.g:''));
  if(at>=0){var tries=0;(function wait(){var hs=document.querySelectorAll('#doc h2,#doc h3');if(hs[at])hs[at].scrollIntoView();else if(tries++<40)setTimeout(wait,100)})()}};
})();
</script>
